name: 提个点子
description: 想要的新道具、新规则、新玩法，不用会写代码
title: "[点子] "
labels: ["点子"]
body:
  - type: markdown
    attributes:
      value: |
        写得越具体越容易做出来。拿不准的地方可以空着，做的时候会回来问你。
  - type: input
    id: name
    attributes:
      label: 点子叫什么
      placeholder: 例如：气势纽带
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 是哪一类
      options:
        - 新道具
        - 新规则或玩法
        - 界面或操作上的改进
        - 其他
    validations:
      required: true
  - type: textarea
    id: effect
    attributes:
      label: 具体效果
      description: 什么时候触发、对谁生效、数值多少、能用几次、用完会怎样
      placeholder: 例如：携带者的队友满HP时被一击打倒，会留下1点HP，剩余的伤害由携带者承受。一局只能发动一次。
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: 如果是道具，你觉得该是什么品质
      options:
        - 不是道具 / 没想好
        - 白色（常见）
        - 蓝色
        - 金色
        - 红色
        - 紫色（最稀有）
  - type: dropdown
    id: mode
    attributes:
      label: 用在哪
      options:
        - 只在双人合作里
        - 单人和合作都要
        - 没想好
  - type: input
    id: credit
    attributes:
      label: 做出来的话怎么署名
      description: 会显示在游戏里的 mod 列表上。不想署名就写「不署名」
      placeholder: 例如：B 站 某某某
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: 还有什么想说的
      description: 为什么想要它、参考了哪个游戏、担心哪里会太强
